<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Webapp File Server</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800/90 backdrop-blur border border-slate-700/80 rounded-2xl shadow-2xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4 shadow-lg">
        <i class="fa-solid fa-server text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Initial System Setup</h1>
      <p class="text-slate-400 text-sm mt-1">Create the master administrator account to secure your file server.</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="setupForm" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Admin Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="username" required minlength="3" placeholder="admin"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Admin Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required minlength="6" placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-1">Confirm Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fa-solid fa-shield-halved"></i>
          </span>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition disabled:opacity-50">
        <span>Initialize Server</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-700/50 text-center text-xs text-slate-500 flex items-center justify-center space-x-2">
      <i class="fa-solid fa-lock text-emerald-400"></i>
      <span>Protected with TLS / HTTPS and bcrypt password encryption</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError 
        ? 'mb-4 p-3 rounded-lg text-sm bg-rose-500/20 text-rose-300 border border-rose-500/30'
        : 'mb-4 p-3 rounded-lg text-sm bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      alertBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Configuring...</span>';

      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert(data.detail || 'Setup failed.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Initialize Server</span><i class="fa-solid fa-arrow-right"></i>';
          return;
        }

        showAlert('Setup complete! Redirecting to file manager...', false);
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        showAlert('Network error communicating with server.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Initialize Server</span><i class="fa-solid fa-arrow-right"></i>';
      }
    });

    // Check if already configured
    fetch('/api/auth/status')
      .then(r => r.json())
      .then(data => {
        if (data.configured) {
          window.location.href = data.authenticated ? '/' : '/login';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
